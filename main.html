<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PravachiUZ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        heading: ['"Outfit"', 'sans-serif'],
                    },
                    colors: {
                        night: {
                            950: '#020617',
                            900: '#0F172A',
                            800: '#1E293B',
                        },
                        brand: {
                            cyan: '#06b6d4',
                            blue: '#3b82f6',
                            purple: '#8b5cf6',
                            accent: '#f43f5e',
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020617;
            color: #E2E8F0;
            overflow-x: hidden;
        }
        
        .glass-dark {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="selection:bg-brand-cyan selection:text-night-950 min-h-screen bg-night-950">

    <!-- Dashboard Nav -->
    <nav class="glass-dark border-b border-white/5 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <a href="index.html" class="flex items-center cursor-pointer group">
                    <img src="imgage/avtotest-logo.png" alt="Logo" class="w-8 h-8 mr-2 object-contain group-hover:scale-110 transition-transform duration-300">
                    <span class="font-heading font-bold text-xl text-white hidden md:block">Pravachi<span class="text-brand-cyan">UZ</span></span>
                </a>
            </div>
            <div class="flex items-center space-x-4">
                <div class="hidden md:flex items-center space-x-2 text-sm text-slate-400">
                    <div class="w-2 h-2 rounded-full bg-brand-cyan animate-pulse"></div>
                    <span>Premium A'zo</span>
                </div>
                <div class="w-10 h-10 rounded-full bg-gradient-to-r from-brand-purple to-brand-blue p-0.5 cursor-pointer" onclick="showProfileMenu()">
                    <div class="w-full h-full rounded-full bg-night-800 flex items-center justify-center text-white font-bold border-2 border-night-900">
                        <span>U</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Welcome Header -->
        <div class="mb-10 animate-slide-up">
            <h1 class="text-3xl md:text-4xl font-heading font-bold text-white mb-2">Xush kelibsiz, <span class="text-brand-blue" id="user-name">Foydalanuvchi</span>! 👋</h1>
            <p class="text-slate-400">Bugungi mashg'ulotlarga tayyormisiz?</p>
        </div>

        <!-- Dashboard Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 animate-slide-up" style="animation-delay: 0.1s;">
            <!-- Card 1 -->
            <div class="glass-card p-6 rounded-2xl relative overflow-hidden group hover:border-brand-blue/50 transition-all">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-brand-blue/10 rounded-full blur-xl group-hover:bg-brand-blue/20 transition-all"></div>
                <h3 class="text-slate-400 text-sm font-bold uppercase mb-2">Umumiy Progress</h3>
                <div class="flex items-end space-x-2 mb-4">
                    <span class="text-4xl font-heading font-bold text-white">42%</span>
                    <span class="text-brand-cyan text-sm mb-1">+12% bu hafta</span>
                </div>
                <div class="w-full bg-night-900 rounded-full h-2 overflow-hidden">
                    <div class="bg-brand-blue h-full w-[42%] rounded-full transition-all"></div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="glass-card p-6 rounded-2xl relative overflow-hidden group hover:border-brand-purple/50 transition-all">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-brand-purple/10 rounded-full blur-xl group-hover:bg-brand-purple/20 transition-all"></div>
                <h3 class="text-slate-400 text-sm font-bold uppercase mb-2">Keyingi Dars</h3>
                <div class="text-xl font-bold text-white mb-1">Chorrahada harakatlanish</div>
                <p class="text-sm text-slate-500 mb-4">3-mavzu • 15 daqiqa</p>
                <button class="bg-brand-purple/20 text-brand-purple hover:bg-brand-purple hover:text-white px-4 py-2 rounded-lg text-sm font-bold transition-all w-full">Davom etish</button>
            </div>

            <!-- Card 3 -->
            <div class="glass-card p-6 rounded-2xl relative overflow-hidden group hover:border-brand-accent/50 transition-all">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-brand-accent/10 rounded-full blur-xl group-hover:bg-brand-accent/20 transition-all"></div>
                <h3 class="text-slate-400 text-sm font-bold uppercase mb-2">Xatolar ustida ishlash</h3>
                <div class="flex items-center space-x-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-night-900 flex items-center justify-center text-brand-accent font-bold">5</div>
                    <span class="text-white text-sm">ta qiyin savol qoldi</span>
                </div>
                <button class="border border-white/10 text-white hover:bg-white/5 px-4 py-2 rounded-lg text-sm font-bold transition-all w-full">Mashq qilish</button>
            </div>
        </div>

        <!-- Categories -->
        <h2 class="text-xl font-bold text-white mb-6 animate-slide-up" style="animation-delay: 0.2s;">Mavzular</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 animate-slide-up" style="animation-delay: 0.3s;">
            <div class="glass-card p-4 rounded-xl hover:border-brand-blue/50 cursor-pointer transition-all flex flex-col items-center text-center">
                <div class="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400 mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                </div>
                <span class="text-white font-bold text-sm">Belgilar</span>
            </div>
            <div class="glass-card p-4 rounded-xl hover:border-brand-purple/50 cursor-pointer transition-all flex flex-col items-center text-center">
                <div class="w-12 h-12 rounded-full bg-purple-500/20 flex items-center justify-center text-purple-400 mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                </div>
                <span class="text-white font-bold text-sm">Chorrahada</span>
            </div>
            <div class="glass-card p-4 rounded-xl hover:border-brand-cyan/50 cursor-pointer transition-all flex flex-col items-center text-center">
                <div class="w-12 h-12 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400 mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <span class="text-white font-bold text-sm">Xavfsizlik</span>
            </div>
            <div class="glass-card p-4 rounded-xl hover:border-brand-accent/50 cursor-pointer transition-all flex flex-col items-center text-center">
                <div class="w-12 h-12 rounded-full bg-rose-500/20 flex items-center justify-center text-rose-400 mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                </div>
                <span class="text-white font-bold text-sm">Tibbiy yordam</span>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (!isLoggedIn || isLoggedIn !== 'true') {
                window.location.href = 'login.html';
            }
            
            // Set user name if available
            const loginMethod = localStorage.getItem('loginMethod');
            if (loginMethod === 'google') {
                document.getElementById('user-name').textContent = 'Foydalanuvchi';
            } else if (loginMethod === 'phone') {
                const phone = localStorage.getItem('phoneNumber');
                if (phone) {
                    document.getElementById('user-name').textContent = phone;
                }
            }
        });

        function showProfileMenu() {
            if (confirm('Hisobdan chiqishni xohlaysizmi?')) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('loginMethod');
                localStorage.removeItem('phoneNumber');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
