<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - PravachiUZ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        heading: ['"Outfit"', 'sans-serif'],
                    },
                    colors: {
                        night: {
                            950: '#020617',
                            900: '#0F172A',
                            800: '#1E293B',
                        },
                        brand: {
                            cyan: '#06b6d4',
                            blue: '#3b82f6',
                            purple: '#8b5cf6',
                            accent: '#f43f5e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020617;
            color: #E2E8F0;
            overflow-x: hidden;
        }
        
        .glass-dark {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .text-glow { text-shadow: 0 0 40px rgba(59, 130, 246, 0.5); }
        
        .bg-grid {
            background-size: 50px 50px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .input-field {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            width: 100%;
            outline: none;
            transition: all 0.3s;
        }
        .input-field:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="selection:bg-brand-cyan selection:text-night-950">

    <!-- Background Elements -->
    <div class="fixed inset-0 bg-grid pointer-events-none z-0"></div>
    <div class="fixed top-0 left-1/4 w-[500px] h-[500px] bg-brand-blue/20 rounded-full blur-[128px] animate-pulse-glow pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-[500px] h-[500px] bg-brand-purple/20 rounded-full blur-[128px] animate-pulse-glow pointer-events-none" style="animation-delay: 2s;"></div>

    <!-- Login Container -->
    <div class="min-h-screen flex items-center justify-center px-4 py-12 relative z-10">
        <div class="w-full max-w-md">
            <!-- Logo -->
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center cursor-pointer group mb-6">
                    <img src="imgage/avtotest-logo.png" alt="Logo" class="w-12 h-12 mr-3 object-contain group-hover:scale-110 transition-transform duration-300">
                    <span class="font-heading font-bold text-3xl text-white tracking-tight">Pravachi<span class="text-brand-cyan">UZ</span></span>
                </a>
                <h1 class="font-heading text-2xl md:text-3xl font-bold text-white mb-2">Xush kelibsiz!</h1>
                <p class="text-slate-400">Tizimga kirish uchun usulni tanlang</p>
            </div>

            <!-- Login Card -->
            <div class="glass-card rounded-3xl p-8 border border-white/10 shadow-2xl relative overflow-hidden">
                <!-- Google Login Button -->
                <button onclick="loginWithGoogle()" class="w-full bg-white text-night-950 font-bold py-3 px-4 rounded-xl flex items-center justify-center mb-6 hover:bg-slate-100 transition-colors">
                    <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google orqali kirish
                </button>

                <div class="flex items-center mb-6">
                    <div class="flex-1 h-px bg-white/10"></div>
                    <span class="px-3 text-xs text-slate-500 uppercase">yoki raqam orqali</span>
                    <div class="flex-1 h-px bg-white/10"></div>
                </div>

                <!-- Phone Login Form -->
                <div id="phone-step-1">
                    <label class="block text-xs font-bold text-slate-400 mb-2 ml-1">TELEFON RAQAM</label>
                    <div class="flex bg-night-800 rounded-xl border border-white/10 overflow-hidden mb-4">
                        <span class="py-3 pl-4 pr-2 text-slate-400 bg-night-900/50 border-r border-white/5">+998</span>
                        <input type="tel" id="phone-input" class="bg-transparent text-white w-full py-3 px-3 outline-none" placeholder="90 123 45 67" maxlength="9">
                    </div>
                    <button onclick="sendCode()" class="w-full bg-brand-blue hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition-all shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                        Kod olish
                    </button>
                </div>

                <!-- OTP Form (Hidden initially) -->
                <div id="phone-step-2" class="hidden">
                    <label class="block text-xs font-bold text-slate-400 mb-2 ml-1">SMS KODNI KIRITING</label>
                    <input type="text" id="otp-input" class="input-field text-center text-2xl tracking-[0.5em] mb-4 font-heading" placeholder="0000" maxlength="4" pattern="[0-9]{4}">
                    <p class="text-xs text-slate-500 text-center mb-4">Kod <span id="display-phone" class="text-white font-mono"></span> raqamiga yuborildi</p>
                    <button onclick="verifyCode()" class="w-full bg-brand-cyan hover:bg-cyan-600 text-white font-bold py-3 rounded-xl transition-all shadow-[0_0_20px_rgba(6,182,212,0.3)]">
                        Tasdiqlash
                    </button>
                    <button onclick="backToPhone()" class="w-full mt-3 text-sm text-slate-400 hover:text-white">Orqaga qaytish</button>
                </div>

                <!-- Back to Home -->
                <div class="mt-6 text-center">
                    <a href="index.html" class="text-sm text-slate-400 hover:text-white transition-colors">
                        ← Bosh sahifaga qaytish
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock verification code
        let mockCode = '';

        function loginWithGoogle() {
            // Mock Google login
            if (confirm('Google orqali kirish (Mock)\n\nHaqiqiy ilovada bu Google OAuth orqali amalga oshiriladi.')) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('loginMethod', 'google');
                window.location.href = 'main.html';
            }
        }

        function sendCode() {
            const phone = document.getElementById('phone-input').value.replace(/\D/g, '');
            if(phone.length < 9) {
                alert("Iltimos, raqamni to'liq kiriting (9 ta raqam)");
                return;
            }
            
            // Generate mock code
            mockCode = Math.floor(1000 + Math.random() * 9000).toString();
            console.log('Mock verification code:', mockCode);
            
            document.getElementById('display-phone').innerText = "+998 " + phone;
            document.getElementById('phone-step-1').classList.add('hidden');
            document.getElementById('phone-step-2').classList.remove('hidden');
            
            // Show code in alert for demo
            alert(`Demo uchun tasdiqlovchi kod: ${mockCode}\n\nHaqiqiy ilovada bu SMS orqali yuboriladi.`);
        }

        function backToPhone() {
            document.getElementById('phone-step-1').classList.remove('hidden');
            document.getElementById('phone-step-2').classList.add('hidden');
            document.getElementById('otp-input').value = '';
        }

        function verifyCode() {
            const code = document.getElementById('otp-input').value;
            if(code.length === 4 && code === mockCode) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('loginMethod', 'phone');
                window.location.href = 'main.html';
            } else if(code.length === 4) {
                alert("Noto'g'ri kod. Qayta urinib ko'ring.\n\nDemo uchun kod: " + mockCode);
                document.getElementById('otp-input').value = '';
            } else {
                alert("Kodni to'g'ri kiriting (4 ta raqam)");
            }
        }

        // Phone input formatting
        document.getElementById('phone-input').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 9) {
                value = value.slice(0, 9);
            }
            e.target.value = value;
        });

        // OTP input - only numbers
        document.getElementById('otp-input').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
        });
    </script>
</body>
</html>
